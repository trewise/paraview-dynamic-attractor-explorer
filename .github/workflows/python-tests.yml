name: Repository Validation

on:
  push:
  pull_request:

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: |
          python -m pip install pytest

      - name: Run Tests
        run: |
          pytest
